google:
  # Path to service account key JSON. Omit to use Application Default Credentials.
  # credentials_file: /path/to/sa-key.json

  # Google Workspace customer ID (required). Find at admin.google.com > Account > Account settings.
  customer_id: C01234567

  # Restrict to a single domain (optional).
  # domain: example.com

  # Filter users by query (optional). Uses Google Directory API query syntax.
  # user_query: "orgUnitPath=/Engineering"

  # Exclude users in these org unit paths. Hierarchical: /Limited also excludes /Limited/Temps.
  # exclude_org_units:
  #   - /Limited
  #   - /Contractors

  # Group filtering. Set include OR exclude, not both.
  # Supports glob patterns matched against group email address.
  # include_groups:
  #   - engineering@example.com
  #   - platform-*@example.com
  # exclude_groups:
  #   - noreply-*@example.com

  # Flatten nested group memberships when listing members. Default: true.
  # include_derived_membership: true

scim:
  # SCIM v2 endpoint URL (required).
  endpoint: https://scim.example.com/v2

  # Bearer token for SCIM authentication (required).
  # Prefer env var SCIM_BEARER_TOKEN over putting this in the file.
  bearer_token: ""

  # Which user attributes to sync. Defaults to all if omitted.
  # Core (always included): external_id, user_name, active
  # Optional: name, emails, title, department, phone_numbers
  attributes:
    - external_id
    - user_name
    - active
    - name
    - emails
    - title
    - department

sync:
  # Where to store sync state. Local path or gs://bucket/path for GCS.
  state_file: /tmp/richmond-state.json

  # Preview changes without applying them.
  dry_run: false

  # Sync groups to SCIM. Default: true.
  # When enabled, Richmond auto-detects whether the SCIM endpoint supports
  # Groups via /ResourceTypes. If not supported, group sync is skipped with
  # a warning. Set to false to skip group sync entirely.
  # sync_groups: true
